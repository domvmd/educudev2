<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .box { fill: white; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .process-box { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .storage-box { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 8; }
      .ai-box { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 2; rx: 8; }
      .output-box { fill: #d1fae5; stroke: #10b981; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, sans-serif; font-size: 14px; fill: #1f2937; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1f2937; }
      .small-text { font-family: Arial, sans-serif; font-size: 12px; fill: #6b7280; }
      .arrow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .data-flow { stroke: #2563eb; stroke-width: 2; fill: none; stroke-dasharray: 5,5; marker-end: url(#bluearrowhead); }
    </style>
    
    <!-- Arrow markers -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6b7280"/>
    </marker>
    <marker id="bluearrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="700" y="30" class="title" text-anchor="middle" font-size="20">Educude Platform System Architecture</text>
  
  <!-- User Input Section -->
  <text x="100" y="70" class="title">1. Content Input</text>
  
  <rect x="50" y="90" width="150" height="50" class="box"/>
  <text x="125" y="120" class="text" text-anchor="middle">PDF Textbooks</text>
  
  <rect x="50" y="150" width="150" height="50" class="box"/>
  <text x="125" y="180" class="text" text-anchor="middle">Audio Lectures</text>
  
  <rect x="50" y="210" width="150" height="50" class="box"/>
  <text x="125" y="240" class="text" text-anchor="middle">Presentation Slides</text>
  
  <rect x="50" y="270" width="150" height="50" class="box"/>
  <text x="125" y="300" class="text" text-anchor="middle">Student Notes</text>
  
  <!-- Processing Section -->
  <text x="350" y="70" class="title">2. Processing Pipeline</text>
  
  <rect x="280" y="90" width="180" height="60" class="process-box"/>
  <text x="370" y="115" class="text" text-anchor="middle">Marker</text>
  <text x="370" y="135" class="small-text" text-anchor="middle">(PDF → Markdown + JSON)</text>
  
  <rect x="280" y="170" width="180" height="60" class="process-box"/>
  <text x="370" y="195" class="text" text-anchor="middle">Whisper API</text>
  <text x="370" y="215" class="small-text" text-anchor="middle">(Audio → Transcripts)</text>
  
  <rect x="280" y="250" width="180" height="60" class="process-box"/>
  <text x="370" y="275" class="text" text-anchor="middle">Content Processor</text>
  <text x="370" y="295" class="small-text" text-anchor="middle">(Slides/Notes → Structured)</text>
  
  <!-- Chunking -->
  <rect x="520" y="150" width="180" height="80" class="process-box"/>
  <text x="610" y="180" class="text" text-anchor="middle">Semantic + Structural</text>
  <text x="610" y="200" class="text" text-anchor="middle">Chunking</text>
  <text x="610" y="218" class="small-text" text-anchor="middle">(300-1000 tokens)</text>
  
  <!-- Storage Section -->
  <text x="850" y="70" class="title">3. Data Storage</text>
  
  <!-- Supabase -->
  <rect x="770" y="90" width="200" height="120" class="storage-box"/>
  <text x="870" y="115" class="text" text-anchor="middle" font-weight="bold">Supabase (PostgreSQL)</text>
  <text x="870" y="135" class="small-text" text-anchor="middle">• Full documents (MD + JSON)</text>
  <text x="870" y="150" class="small-text" text-anchor="middle">• User accounts and auth</text>
  <text x="870" y="165" class="small-text" text-anchor="middle">• Annotations and notes</text>
  <text x="870" y="180" class="small-text" text-anchor="middle">• Quiz history</text>
  <text x="870" y="195" class="small-text" text-anchor="middle">• File storage (PDFs)</text>
  
  <!-- Voyage AI -->
  <rect x="520" y="280" width="180" height="60" class="ai-box"/>
  <text x="610" y="305" class="text" text-anchor="middle">Voyage AI</text>
  <text x="610" y="325" class="small-text" text-anchor="middle">(Text → Embeddings)</text>
  
  <!-- Pinecone -->
  <rect x="770" y="240" width="200" height="100" class="storage-box"/>
  <text x="870" y="265" class="text" text-anchor="middle" font-weight="bold">Pinecone</text>
  <text x="870" y="285" class="small-text" text-anchor="middle">• Vector embeddings</text>
  <text x="870" y="300" class="small-text" text-anchor="middle">• Semantic search</text>
  <text x="870" y="315" class="small-text" text-anchor="middle">• Metadata + doc_id refs</text>
  <text x="870" y="330" class="small-text" text-anchor="middle">• Namespaced by type</text>
  
  <!-- User Features Section -->
  <text x="100" y="400" class="title">4. User Features</text>
  
  <rect x="50" y="420" width="180" height="50" class="output-box"/>
  <text x="140" y="450" class="text" text-anchor="middle">📖 Read and Annotate</text>
  
  <rect x="50" y="480" width="180" height="50" class="output-box"/>
  <text x="140" y="510" class="text" text-anchor="middle">✏️ Take Notes</text>
  
  <rect x="50" y="540" width="180" height="50" class="output-box"/>
  <text x="140" y="570" class="text" text-anchor="middle">🎯 Generate Quizzes</text>
  
  <rect x="50" y="600" width="180" height="50" class="output-box"/>
  <text x="140" y="630" class="text" text-anchor="middle">📊 Track Progress</text>
  
  <!-- Quiz Generation Flow -->
  <text x="400" y="400" class="title">5. Quiz Generation Pipeline</text>
  
  <rect x="350" y="420" width="160" height="50" class="process-box"/>
  <text x="430" y="450" class="text" text-anchor="middle">Topic Selection</text>
  
  <rect x="350" y="490" width="160" height="60" class="process-box"/>
  <text x="430" y="515" class="text" text-anchor="middle">Vector Search</text>
  <text x="430" y="535" class="small-text" text-anchor="middle">(Pinecone)</text>
  
  <rect x="550" y="490" width="180" height="60" class="process-box"/>
  <text x="640" y="515" class="text" text-anchor="middle">Retrieve Full Content</text>
  <text x="640" y="535" class="small-text" text-anchor="middle">(Supabase)</text>
  
  <rect x="770" y="420" width="200" height="80" class="ai-box"/>
  <text x="870" y="450" class="text" text-anchor="middle" font-weight="bold">DeepSeek V3</text>
  <text x="870" y="470" class="small-text" text-anchor="middle">• Bloom's taxonomy questions</text>
  <text x="870" y="485" class="small-text" text-anchor="middle">• Multi-source synthesis</text>
  
  <rect x="1020" y="440" width="160" height="50" class="output-box"/>
  <text x="1100" y="470" class="text" text-anchor="middle">Generated Quiz</text>
  
  <!-- Export Options -->
  <text x="400" y="600" class="title">6. Export and Share</text>
  
  <rect x="350" y="620" width="120" height="40" class="output-box"/>
  <text x="410" y="645" class="small-text" text-anchor="middle">PDF Export</text>
  
  <rect x="490" y="620" width="120" height="40" class="output-box"/>
  <text x="550" y="645" class="small-text" text-anchor="middle">Anki/Quizlet</text>
  
  <rect x="630" y="620" width="120" height="40" class="output-box"/>
  <text x="690" y="645" class="small-text" text-anchor="middle">Study Guides</text>
  
  <rect x="770" y="620" width="120" height="40" class="output-box"/>
  <text x="830" y="645" class="small-text" text-anchor="middle">Share/Collab</text>
  
  <!-- Real-time Features -->
  <rect x="1020" y="90" width="200" height="80" class="process-box"/>
  <text x="1120" y="115" class="text" text-anchor="middle" font-weight="bold">Real-time Features</text>
  <text x="1120" y="135" class="small-text" text-anchor="middle">• Live collaboration</text>
  <text x="1120" y="150" class="small-text" text-anchor="middle">• Shared annotations</text>
  <text x="1120" y="165" class="small-text" text-anchor="middle">(Supabase Realtime)</text>
  
  <!-- Arrows showing flow -->
  <!-- Input to Processing -->
  <path d="M 200 115 L 280 115" class="arrow"/>
  <path d="M 200 175 L 280 200" class="arrow"/>
  <path d="M 200 235 L 280 260" class="arrow"/>
  <path d="M 200 295 L 280 285" class="arrow"/>
  
  <!-- Processing to Chunking -->
  <path d="M 460 120 L 520 180" class="arrow"/>
  <path d="M 460 200 L 520 190" class="arrow"/>
  <path d="M 460 280 L 520 200" class="arrow"/>
  
  <!-- Chunking to Storage -->
  <path d="M 700 190 L 770 150" class="arrow"/>
  <text x="735" y="165" class="small-text">Full content</text>
  
  <!-- Chunking to Embeddings -->
  <path d="M 610 230 L 610 280" class="arrow"/>
  
  <!-- Embeddings to Pinecone -->
  <path d="M 700 310 L 770 290" class="arrow"/>
  <text x="735" y="305" class="small-text">Vectors</text>
  
  <!-- Quiz Generation Flow -->
  <path d="M 230 560 L 350 445" class="arrow"/>
  <path d="M 430 470 L 430 490" class="arrow"/>
  <path d="M 510 520 L 550 520" class="arrow"/>
  <path d="M 730 520 L 770 460" class="arrow"/>
  <path d="M 970 460 L 1020 460" class="arrow"/>
  
  <!-- Data retrieval flows -->
  <path d="M 870 340 L 430 490" class="data-flow"/>
  <text x="650" y="410" class="small-text">Search vectors</text>
  
  <path d="M 870 210 L 640 490" class="data-flow"/>
  <text x="750" y="360" class="small-text">Fetch content</text>
  
  <!-- Realtime connection -->
  <path d="M 970 170 L 1020 150" class="data-flow"/>
  
  <!-- Storage connection -->
  <path d="M 870 490 L 870 210" class="data-flow"/>
  <text x="880" y="350" class="small-text">Save quiz</text>
  
  <!-- Legend -->
  <rect x="1050" y="900" width="300" height="80" fill="none" stroke="#e5e7eb" stroke-width="1" rx="5"/>
  <text x="1060" y="920" class="small-text" font-weight="bold">Legend:</text>
  <line x1="1060" y1="935" x2="1100" y2="935" class="arrow"/>
  <text x="1110" y="940" class="small-text">Process flow</text>
  <line x1="1060" y1="955" x2="1100" y2="955" class="data-flow"/>
  <text x="1110" y="960" class="small-text">Data reference</text>
  
  <!-- Tech Stack Labels -->
  <text x="700" y="750" class="title" text-anchor="middle" font-size="18">Educude Tech Stack</text>
  
  <text x="500" y="780" class="text">📄 Processing: Marker, Whisper</text>
  <text x="500" y="805" class="text">🗄️ Databases: Supabase + Pinecone</text>
  <text x="500" y="830" class="text">🧠 AI: Voyage AI + DeepSeek V3</text>
  <text x="500" y="855" class="text">⚡ Backend: FastAPI + LangChain</text>
  <text x="500" y="880" class="text">🎨 Frontend: React/Next.js</text>
  
  <text x="850" y="780" class="text" font-weight="bold">Cost Breakdown (1000 users/mo):</text>
  <text x="850" y="805" class="small-text">• Supabase: $25-100</text>
  <text x="850" y="825" class="small-text">• Pinecone: $200-500</text>
  <text x="850" y="845" class="small-text">• Voyage AI: $20-40</text>
  <text x="850" y="865" class="small-text">• DeepSeek V3: $50-150</text>
  <text x="850" y="885" class="small-text">• Processing: $75-150</text>
  <text x="850" y="905" class="small-text" font-weight="bold">Total: ~$370-940/month</text>
</svg>